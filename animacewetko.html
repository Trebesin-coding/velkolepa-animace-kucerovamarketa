<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Velkolepá animace</title>

<style>
    body {
        margin: 0;
        background: #000000;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    h1 {
        margin: 0 0 20px 0;
        margin-bottom: 150px;
        font-family: 'Times New Roman', Times, serif;
        font-size: 32px;
        text-shadow: 0px 0px 20px #79bfea, 0px 0px 50px #89caf3;
    }


    #ball {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgb(57, 2, 129);
        cursor: pointer;
    }

    @keyframes pulse {
        0% { transform: scale(1) rotate(0deg); }
        50% { transform: scale(2) rotate(40deg); } 
        100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes colors {
        0% { background: rgb(57, 2, 129); }
        20% { background: rgb(113, 2, 87); }
        30% { background: rgb(230, 72, 161); }
        50% { background: rgb(247, 145, 235); }

        100% { background: rgb(57, 2, 129); }
    }

    
    @keyframes glow {
        0%   { box-shadow: 0 0 8px rgba(146, 210, 236, 0.9); }
        50%  { box-shadow: 0 0 30px rgba(102, 108, 228, 0.866); }
        100% { box-shadow: 0 0 8px rgba(123, 234, 234, 0.914); }
    }

    #ball.active {
        animation: pulse 10s infinite, colors 7s infinite, glow 5s infinite;
        
    }
</style>

</head>
<body>
    <h1>Klikněte na kolečko pro spuštění a vypnutí magie</h1>

<div id="ball"></div>

<script>
    const ball = document.getElementById("ball");

    ball.addEventListener("click", () => {
        ball.classList.toggle("active");
    });
</script>

</body>
</html>
